<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original Tichu-compatible deck sheet for the local TichuBot UI.
  It deliberately uses no scans, logos, or publisher artwork.  The sheet is
  arranged as 90×137px faces at x=10+98*column and y=7+143*row, which keeps
  the existing responsive sprite renderer simple.
-->
