    <style>
      .edge { fill: #fbf8eb; stroke: #173b45; stroke-width: 1.2; }
      .inner { fill: none; stroke: #d4ae5d; stroke-width: .8; }
      .rank { font: 700 17px Georgia, serif; text-anchor: middle; }
      .suitname { font: 700 5px Arial, sans-serif; text-anchor: middle; letter-spacing: 1.1px; }
      .special-title { font: 700 9px Georgia, serif; text-anchor: middle; letter-spacing: .8px; }
      .special-note { font: 600 4.2px Arial, sans-serif; text-anchor: middle; letter-spacing: .55px; }
    </style>
    <g id="base"><rect class="edge" x=".6" y=".6" width="88.8" height="135.8" rx="5.5"/><rect class="inner" x="4" y="4" width="82" height="129" rx="3"/><path d="M9 31h72M9 105h72" stroke="#d4ae5d" stroke-width=".55" opacity=".65"/></g>
